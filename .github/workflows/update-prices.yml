name: 시세 자동 갱신

# ⚠️ GitHub Actions 의 schedule 은 "정시 실행"을 보장하지 않습니다.
#    부하가 몰리면 그 회차를 통째로 건너뜁니다. 그래서:
#      1) 0분·30분 같은 "많이 몰리는 시각"을 피해 7/27/47분에 걸었습니다.
#      2) 한 번 걸러도 20분 뒤 다음 회차가 받아주도록 촘촘히 뒀습니다.
#
# cron 은 UTC 기준입니다.  KST = UTC+9,  ET(서머타임) = UTC-4
#
#   7,17,…,57 0-6 UTC = KST 09:07~15:57  → 국내장 10분마다 (네이버 실시간)
#   47       6    UTC = KST 15:47        → 국내 종가 확정
#   7,37      13-23 UTC = KST 22:07~08:37 → 미국 30분마다 (소스가 15분 지연)
#   37       0    UTC = ET  20:37        → 미국 애프터 마감 후 종가 확정
#
# 공개(Public) 저장소라 Actions 시간 제한이 없습니다.
# 국내는 네이버가 실시간이라 촘촘하게, 미국은 소스가 15분 지연이라 30분 간격으로 둡니다.

on:
  schedule:
    - cron: "7,17,27,37,47,57 0-6 * * 1-5"   # 국내장 (10분 간격 — 네이버는 실시간)
    - cron: "47 6 * * 1-5"           # 국내 종가
    - cron: "7,37 13-23 * * 1-5"     # 미국장 (30분 간격)
    - cron: "37 0 * * 2-6"           # 미국 종가 (ET 전날 20:37)
  workflow_dispatch:                 # 수동 실행 버튼

# 이전 실행이 아직 돌고 있으면 취소하고 최신 것만 남긴다 (밀림 방지)
concurrency:
  group: fetch-prices
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 시세 수집 및 저장
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_OWNER_UID: ${{ secrets.SUPABASE_OWNER_UID }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          KIWOOM_ENV: ${{ secrets.KIWOOM_ENV }}
        run: python scripts/fetch_prices.py
